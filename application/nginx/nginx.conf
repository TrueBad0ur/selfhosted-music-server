events {}

http {
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # This Navidrome build does not send Cache-Control on the SPA index, so the
    # browser caches the HTML. After a Google login the cached (unauthenticated)
    # index is replayed, its embedded appConfig has no "auth" block, and the SPA
    # falls back to the login form. Only the HTML must stay uncached - hashed
    # JS/CSS assets keep their normal caching. An empty value makes nginx skip
    # the header entirely.
    map $upstream_http_content_type $spa_cache_control {
        ~*text/html  "no-store, no-cache, must-revalidate";
        default      "";
    }

    server {
        listen 8082;
        server_name music.truebad0ur.space music.kubehomelab.space;

        # Set at the server level, not just on location /tools/: auth_request
        # (used by /tools/ and /) fires an internal subrequest to the
        # `/oauth2/auth` location below to check the session before the real
        # request is let through, and nginx enforces client_max_body_size
        # against *that* location's own scope, not the original request's -
        # a location-scoped limit on /tools/ alone still 500s on any upload
        # over 1M once auth_request's own check rejects it first.
        client_max_body_size 2G;

        # Digital Asset Links - lets Chrome open /tools/ as a Trusted Web Activity
        # (full-screen, no browser toolbar) for the signed Tempo APK instead of a
        # regular Custom Tab. Public/unauthenticated: Google's verifier fetches it
        # directly, no SSO session involved.
        location = /.well-known/assetlinks.json {
            alias /etc/nginx/assetlinks.json;
            default_type application/json;
        }

        # Subsonic/OpenSubsonic API - untouched, no SSO gate.
        # Tempo and other API clients keep using Navidrome's own username/password auth.
        location /rest/ {
            proxy_pass http://navidrome:4533;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # oauth2-proxy's own endpoints (login, callback, signout)
        location /oauth2/ {
            proxy_pass http://oauth2-proxy:4180;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://oauth2-proxy:4180/oauth2/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /__google-btn.js {
            alias /etc/nginx/google-btn.js;
            default_type application/javascript;
        }

        location = /__sidebar-link.js {
            alias /etc/nginx/sidebar-link.js;
            default_type application/javascript;
        }

        # Disable Navidrome's PWA service worker - it precaches index.html and
        # serves it cache-first, replaying a stale unauthenticated page after
        # Google login. See kill-sw.js.
        location = /app/sw.js {
            alias /etc/nginx/kill-sw.js;
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # SPA background API calls (job polling etc.) - deliberately NOT
        # redirected to Google on 401. The frontend polls /tools/api/jobs
        # every 5s regardless of auth state; if a stray unauthenticated poll
        # (stale tab, session just expired) hit /oauth2/sign_in like a real
        # page nav would, it mints its own CSRF/state cookie and clobbers
        # whatever cookie the user's own, visible login tab is mid-flow on -
        # that's what "CSRF token mismatch" on a fresh login came from. A
        # bare 401 here just makes the frontend's fetch() fail quietly.
        location /tools/api/ {
            auth_request /oauth2/auth;
            auth_request_set $email $upstream_http_x_auth_request_email;

            proxy_set_header Remote-User $email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_pass http://web:8091;
        }

        # Web UI (music tools), gated by Google SSO, reached by container name.
        location /tools/ {
            auth_request /oauth2/auth;
            auth_request_set $email $upstream_http_x_auth_request_email;
            error_page 401 = /oauth2/sign_in?rd=$http_x_forwarded_proto://$host$request_uri;

            proxy_set_header Remote-User $email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_pass http://web:8091;
        }

        # Everything else -> Navidrome browser UI. Google SSO is optional here:
        # if there's no oauth2-proxy session, fall through to Navidrome's own
        # username/password login (needed so admin/password access always works,
        # even if Google SSO is down or before any account has been granted access).
        location / {
            auth_request /oauth2/auth;
            auth_request_set $email $upstream_http_x_auth_request_email;
            error_page 401 = @navidrome_direct;

            proxy_set_header Remote-User $email;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # sub_filter can't rewrite gzip-compressed bodies; ask Navidrome for plain text.
            proxy_set_header Accept-Encoding "";

            proxy_pass http://navidrome:4533;
            add_header Cache-Control $spa_cache_control always;

            # Add a sidebar entry linking to the Web UI at /tools/.
            sub_filter '</body>' '<script src="/__sidebar-link.js"></script></body>';
            sub_filter_once on;
        }

        # No Google session: proxy straight to Navidrome with no Remote-User header,
        # so it falls back to its own login page (admin/password). Inject a
        # "Sign in with Google" link so ExtAuth login is reachable without
        # knowing the /oauth2/start URL by heart.
        location @navidrome_direct {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";

            proxy_pass http://navidrome:4533;
            add_header Cache-Control $spa_cache_control always;

            # Navidrome's login form is rendered client-side by React, so there's
            # nothing to match in the server-rendered HTML. Inject scripts that
            # wait for the relevant elements to appear: a Google button under
            # the login form, and (once logged in via admin/password, since this
            # HTML isn't re-fetched on that path) a sidebar entry for /tools/.
            sub_filter '</body>' '<script src="/__google-btn.js"></script><script src="/__sidebar-link.js"></script></body>';
            sub_filter_once on;
        }
    }
}
