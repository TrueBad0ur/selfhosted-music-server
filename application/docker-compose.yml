services:
  navidrome:
    image: deluan/navidrome:pr-5044
    container_name: navidrome
    user: "1000:1000"
    restart: always
    ports:
      - "4533:4533"
    volumes:
      - ./data:/data
      - ./music:/music:ro
      - ./cache:/cache
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_CACHEFOLDER: /cache
      ND_DEFAULTTHEME: Spotify-ish
      ND_UIWELCOMEMESSAGE: "Welcome to music.kubehomelab.space"
      ND_MUSICBRAINZ_ENABLED: "true"
      ND_MUSICBRAINZ_SERVER: "https://musicbrainz.org"
      ND_MUSICBRAINZ_COVERART_ENABLED: "true"
      ND_MUSICBRAINZ_USERAGENT: "Navidrome/0.52 (https://music.kubehomelab.space)"
      ND_PLUGINS_ENABLED: true
      ND_PLUGINS_AUTORELOAD: true
      ND_AGENTS: "audiomuseai,lastfm,spotify,deezer"
      ND_DEVARTISTINFOTIMETOLIVE: "1s"
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET}"
      ND_COVERARTPRIORITY: "folder,embedded,external"
      ND_EXTAUTH_USERHEADER: "Remote-User"
      ND_EXTAUTH_TRUSTEDSOURCES: "172.18.0.0/16"
    dns:
      10.10.10.145

  nginx:
    image: nginx:1.27-alpine
    container_name: music_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/google-btn.js:/etc/nginx/google-btn.js:ro
      - ./nginx/kill-sw.js:/etc/nginx/kill-sw.js:ro
      - ./nginx/sidebar-link.js:/etc/nginx/sidebar-link.js:ro
      - ./nginx/assetlinks.json:/etc/nginx/assetlinks.json:ro
    ports:
      - "8082:8082"
    depends_on:
      - navidrome
      - web
      - oauth2-proxy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: music_oauth2_proxy
    restart: always
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET}"
      OAUTH2_PROXY_COOKIE_DOMAINS: ".truebad0ur.space,.kubehomelab.space"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".truebad0ur.space,.kubehomelab.space"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REDIRECT_URL: "https://music.truebad0ur.space/oauth2/callback"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"

  web:
    build: ./web
    container_name: music_web
    restart: always
    user: "1000:1000"
    volumes:
      - ./music:/music
      - ./incoming:/incoming
      - ../prepare/app:/prepare_app:ro
    environment:
      MUSIC_DIR: /music
      INCOMING_DIR: /incoming
      PREPARE_APP: /prepare_app
      LASTFM_KEY: "${LASTFM_APIKEY}"
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-2147483648}"
    depends_on:
      - navidrome

  redis:
    image: redis:7-alpine
    container_name: audiomuse-redis
    volumes:
      - ./audiomuse/redis:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
    volumes:
      - ./audiomuse/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  audiomuse-flask:
    build: ./audiomuse-patch
    container_name: audiomuse-ai-flask
    ports:
      - "8000:8000"
    environment:
      SERVICE_TYPE: "flask"
      MEDIASERVER_TYPE: "navidrome"
      NAVIDROME_URL: "http://navidrome:4533"
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      AI_MODEL_PROVIDER: "${AI_MODEL_PROVIDER:-NONE}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_SERVER_URL: "${OPENAI_SERVER_URL:-}"
      OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CLAP_ENABLED: "${CLAP_ENABLED:-true}"
      TEMP_DIR: "/app/temp_audio"
      API_TOKEN: "${API_TOKEN:-}"
      AUDIOMUSE_USER: "${AUDIOMUSE_USER:-}"
      AUDIOMUSE_PASSWORD: "${AUDIOMUSE_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ./audiomuse/temp-flask:/app/temp_audio
    depends_on:
      - redis
      - postgres
      - navidrome
    restart: unless-stopped

  audiomuse-worker:
    build: ./audiomuse-patch
    container_name: audiomuse-ai-worker
    environment:
      SERVICE_TYPE: "worker"
      MEDIASERVER_TYPE: "navidrome"
      NAVIDROME_URL: "http://navidrome:4533"
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      AI_MODEL_PROVIDER: "${AI_MODEL_PROVIDER:-NONE}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_SERVER_URL: "${OPENAI_SERVER_URL:-}"
      OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CLAP_ENABLED: "${CLAP_ENABLED:-true}"
      TEMP_DIR: "/app/temp_audio"
      API_TOKEN: "${API_TOKEN:-}"
      AUDIOMUSE_USER: "${AUDIOMUSE_USER:-}"
      AUDIOMUSE_PASSWORD: "${AUDIOMUSE_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ./audiomuse/temp-worker:/app/temp_audio
    depends_on:
      - redis
      - postgres
      - navidrome
    restart: unless-stopped
