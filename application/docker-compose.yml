services:
  navidrome:
    image: deluan/navidrome:pr-5044
    container_name: navidrome
    user: "1000:1000"
    restart: always
    ports:
      - "4533:4533"
    volumes:
      - ./data:/data
      - ./music:/music:ro
      - ./cache:/cache
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_CACHEFOLDER: /cache
      ND_DEFAULTTHEME: Spotify-ish
      ND_UIWELCOMEMESSAGE: "Welcome to music.kubehomelab.space"
      ND_MUSICBRAINZ_ENABLED: "true"
      ND_MUSICBRAINZ_SERVER: "https://musicbrainz.org"
      ND_MUSICBRAINZ_COVERART_ENABLED: "true"
      ND_MUSICBRAINZ_USERAGENT: "Navidrome/0.52 (https://music.kubehomelab.space)"
      ND_PLUGINS_ENABLED: true
      ND_PLUGINS_AUTORELOAD: true
      ND_AGENTS: "audiomuseai,lastfm,spotify,deezer"
      ND_DEVARTISTINFOTIMETOLIVE: "1s"
      ND_LASTFM_ENABLED: "true"
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET}"
      ND_COVERARTPRIORITY: "folder,embedded,external"
    dns:
      10.10.10.145

  #nginx:
  #  image: nginx:latest
  #  container_name: navidrome_nginx
  #  restart: always
  #  depends_on:
  #    - navidrome
  #  ports:
  #    - "80:80"
  #  volumes:
  #    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build: ./web
    container_name: music_web
    restart: always
    user: "1000:1000"
    volumes:
      - ./music:/music
      - ./incoming:/incoming
      - ../prepare/app:/prepare_app:ro
    environment:
      MUSIC_DIR: /music
      INCOMING_DIR: /incoming
      PREPARE_APP: /prepare_app
      LASTFM_KEY: "${LASTFM_APIKEY}"
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      WEB_USERNAME: "${NAVIDROME_USER}"
      WEB_PASSWORD: "${NAVIDROME_PASSWORD}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-2147483648}"
    ports:
      - "8091:8091"
    depends_on:
      - navidrome

  redis:
    image: redis:7-alpine
    container_name: audiomuse-redis
    volumes:
      - ./audiomuse/redis:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
    volumes:
      - ./audiomuse/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  audiomuse-flask:
    build: ./audiomuse-patch
    container_name: audiomuse-ai-flask
    ports:
      - "8000:8000"
    environment:
      SERVICE_TYPE: "flask"
      MEDIASERVER_TYPE: "navidrome"
      NAVIDROME_URL: "http://navidrome:4533"
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      AI_MODEL_PROVIDER: "${AI_MODEL_PROVIDER:-NONE}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_SERVER_URL: "${OPENAI_SERVER_URL:-}"
      OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CLAP_ENABLED: "${CLAP_ENABLED:-true}"
      TEMP_DIR: "/app/temp_audio"
      API_TOKEN: "${API_TOKEN:-}"
      AUDIOMUSE_USER: "${AUDIOMUSE_USER:-}"
      AUDIOMUSE_PASSWORD: "${AUDIOMUSE_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ./audiomuse/temp-flask:/app/temp_audio
    depends_on:
      - redis
      - postgres
      - navidrome
    restart: unless-stopped

  audiomuse-worker:
    build: ./audiomuse-patch
    container_name: audiomuse-ai-worker
    environment:
      SERVICE_TYPE: "worker"
      MEDIASERVER_TYPE: "navidrome"
      NAVIDROME_URL: "http://navidrome:4533"
      NAVIDROME_USER: "${NAVIDROME_USER}"
      NAVIDROME_PASSWORD: "${NAVIDROME_PASSWORD}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: ${POSTGRES_DB:-audiomusedb}
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      AI_MODEL_PROVIDER: "${AI_MODEL_PROVIDER:-NONE}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_SERVER_URL: "${OPENAI_SERVER_URL:-}"
      OPENAI_MODEL_NAME: "${OPENAI_MODEL_NAME:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
      CLAP_ENABLED: "${CLAP_ENABLED:-true}"
      TEMP_DIR: "/app/temp_audio"
      API_TOKEN: "${API_TOKEN:-}"
      AUDIOMUSE_USER: "${AUDIOMUSE_USER:-}"
      AUDIOMUSE_PASSWORD: "${AUDIOMUSE_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ./audiomuse/temp-worker:/app/temp_audio
    depends_on:
      - redis
      - postgres
      - navidrome
    restart: unless-stopped
